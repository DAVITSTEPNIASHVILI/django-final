{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "profile.css" %}">
    <style>
        #btn {
            border: none;
            color: white;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div>
        <h1>Current User</h1>
        {% if current_user.profile_picture %}
            <img src="{{ current_user.profile_picture.url }}">
        {% endif %}
        <form method='POST' enctype='multipart/form-data'>
            {% csrf_token %}
            <input type="file" name='img'>
            <input type="submit">
        </form>
        <h1>Username: {{ current_user.username }}</h1>
        <p>Age: {{ current_user.age }}</p>
        <p>Email: {{ current_user.email }}</p>
        <p>Password: {{ current_user.password }}</p>

        <a href="{% url "profile_edit" %}"><button id='btn'>Edit</button></a>
        <a href="{% url "all_post" %}"><button id='btn'>Main Page</button></a>
    </div>
</body>
</html>
