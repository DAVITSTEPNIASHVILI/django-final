{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{% static "user_details.css" %}">
    <style>
        #btn {
            border: none;
            color: white;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body>
    <div>
        {% if users.profile_picture %}
            <img src="{{ users.profile_picture.url }}" style='width: 64px; height: 64px; border-radius: 50%;'>
        {% endif %}
        <h1>Username: {{ users.username }}</h1>
        <p>Age: {{ users.age }}</p>
        <a href="{% url "all_post" %}"><button id='btn'>Main Page</button></a>
    </div>
</body>
</html>
